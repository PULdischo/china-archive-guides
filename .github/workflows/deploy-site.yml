# Build the 11ty site (with its static search index) and deploy to GitHub Pages.
# TODO: fetch the site bundle (guides.jsonl, csi) from the Hugging Face dataset release first.
# The pipeline (harvest/OCR) runs separately; this job only needs data/export/site/.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/export/site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages from a private repo needs a paid plan; skip until the repo is public.
    # (deploy needs build, so it is skipped too.)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
