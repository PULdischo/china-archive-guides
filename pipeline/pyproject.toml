[project]
name = "cah"
version = "0.1.0"
description = "Pipeline for the China archive & local history guides project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "rapidocr-onnxruntime>=1.4",
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.53",
    "nh3>=0.2",
    "pyarrow>=17",
    "huggingface_hub>=0.25",
]

[project.scripts]
cah = "cah.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
