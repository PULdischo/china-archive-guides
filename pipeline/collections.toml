# What the pipeline processes, per collection.
# - browse: a DPUL browse category; every item in it is harvested (re-listed each run,
#   so new items are picked up and removed ones are reported).
# - ids: an explicit list of DPUL access identifiers (https://dpul.princeton.edu/ealtoc/catalog/{id}).
# Limits: 0 = no limit.

[handbook]
browse = "chinese-archival-handbooks"   # 343 items as of 2026-10-11
max_pages_per_volume = 0

